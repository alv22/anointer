<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#000"/>

  <!-- The heavens ablaze -->
  <text x="600" y="200" font-family="Georgia, serif" font-size="120" fill="#fff" fill-opacity="0.15" text-anchor="middle">☨</text>

  <!-- THE WORD - massive, unapologetic -->
  <text x="600" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="180" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="-8">ANOINTER</text>

  <!-- The whisper beneath -->
  <text x="600" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic" fill="#fff" fill-opacity="0.75" text-anchor="middle">Bless your typography.</text>
</svg>
